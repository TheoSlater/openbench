[package]
name = "polyui"
default-run = "polyui"
version = "0.22.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "polyui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
st-tts = "0.3"

[profile.release]
# Cargo keeps symbols in release by default: 43MB binary -> 34MB stripped.
strip = true

[features]
default = []
dev-sql-console = []
whisper-cuda = ["whisper-rs/cuda"]

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
tokio = { version = "1.50.0", features = ["io-util", "process", "time"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
bcrypt = "0.15"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
reqwest = { version = "0.12", features = ["rustls-tls", "stream", "gzip", "brotli", "deflate", "http2"] }
async-trait = "0.1"
futures = "0.3.32"
log = "0.4"
sha2 = "0.10"
url = "2"
percent-encoding = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-supertonic = "0.3"
ort = { version = "2.0.0-rc.12", features = ["load-dynamic"] }
windows-sys = { version = "0.59", features = ["Win32_Graphics_Dwm", "Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
raw-window-handle = "0.6"
dirs = "6"
ts-rs = "12"
keyring = "4.1"
jsonwebtoken = "9"
whisper-rs = "0.16"
cpal = "0.15"
hound = "3.5"
portable-pty = "0.9"
sysinfo = "0.33"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }

[target."cfg(unix)".dependencies]
libc = "0.2.189"
rustix = { version = "1", features = ["process"] }
