# Groups GitHub's auto-generated release notes (generate_release_notes: true).
changelog:
  exclude:
    labels: [ignore-for-release]
    authors: [dependabot, github-actions]
  categories:
    - title: Features
      labels: [feature, enhancement]
    - title: Fixes
      labels: [bug, fix]
    - title: Performance
      labels: [performance]
    - title: Docs
      labels: [documentation]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
