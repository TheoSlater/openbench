name: Nightly

on:
  schedule:
    # 21:00 Europe/London year-round. GitHub cron is UTC-only, so fire at
    # both candidate hours and let the gate job drop the wrong one.
    - cron: "0 20 * * *" # 21:00 London during BST
    - cron: "0 21 * * *" # 21:00 London during GMT
  workflow_dispatch:

# Scheduled runs always use the default branch (main), which is what we want.
concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: Should build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$(TZ=Europe/London date +%H)" != "21" ]; then
            echo "Not 21:00 in London, skipping."
            echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "No commits on main in the last 24h, skipping."
            echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"

  build:
    needs: [gate]
    if: needs.gate.outputs.build == 'true'
    uses: ./.github/workflows/build.yml

  release:
    name: Nightly pre-release
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - id: version
        run: echo "tag=v$(node -p "require('./package.json').version")-nightly.$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect release files
        run: |
          mkdir -p release-files
          find artifacts -type f -exec mv {} release-files/ \;
          ls -la release-files/

      - name: Prune nightlies older than the last 7
        uses: actions/github-script@v7
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const stale = releases
              .filter(r => r.tag_name.includes('-nightly.'))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
              .slice(7);
            for (const release of stale) {
              console.log(`Deleting ${release.tag_name}`);
              await github.rest.repos.deleteRelease({
                ...context.repo, release_id: release.id,
              });
              await github.rest.git.deleteRef({
                ...context.repo, ref: `tags/${release.tag_name}`,
              }).catch(e => console.log(`could not delete tag: ${e.message}`));
            }

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Nightly ${{ steps.version.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: release-files/*
