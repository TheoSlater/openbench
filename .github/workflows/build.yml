name: Build

# Reusable matrix build. Called by release.yml and nightly.yml so the
# platform build + bundle validation lives in exactly one place.
on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            platform: macos
            artifact: macos
          - name: Windows
            os: windows-latest
            platform: windows
            arch: x64
            artifact: windows
          - name: Linux x64
            os: ubuntu-24.04
            platform: linux
            arch: x64
            artifact: linux-x64
          - name: Linux arm64
            os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            artifact: linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags: generate-release-notes.mjs walks git describe.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libasound2-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            rpm \
            xdg-utils

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Generate bundled release notes
        run: bun run release-notes:generate

      - name: Typecheck and build frontend
        run: bun run build

      - name: Validate frontend build inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          find dist/assets -maxdepth 1 -name '*.js' -type f | grep -q .
          find dist/assets -maxdepth 1 -name '*.css' -type f | grep -q .
          test -f src/generated/releaseNotes.json
          if grep -E 'src="/assets/|href="/assets/|href="/polyui-icon' dist/index.html; then
            echo "dist/index.html contains absolute production asset paths."
            exit 1
          fi

      - name: Configure macOS native build flags
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          {
            echo "CMAKE_OSX_DEPLOYMENT_TARGET=11.0"
            echo "CMAKE_C_FLAGS=-mmacosx-version-min=11.0"
            echo "CMAKE_CXX_FLAGS=-D_LIBCPP_DISABLE_AVAILABILITY -mmacosx-version-min=11.0"
          } >> "$GITHUB_ENV"

      - name: Build PolyUI app
        shell: bash
        run: |
          rm -rf src-tauri/target/release/bundle
          bun run tauri build --ci

      - name: List Tauri bundle outputs
        shell: bash
        run: find src-tauri/target/release/bundle -maxdepth 4 -type f

      # --- Windows -----------------------------------------------------
      - name: Validate Windows bundle
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $bundle = "src-tauri/target/release/bundle"
          if (!(Test-Path "src-tauri/target/release/polyui.exe")) { throw "Missing release executable" }
          $nsis = Get-ChildItem "$bundle/nsis" -Filter "PolyUI_$($version)_x64-setup.exe" | Where-Object { $_.Name -notmatch "Ollama" } | Select-Object -First 1
          if (!$nsis) { throw "Missing normal NSIS installer" }
          $msi = Get-ChildItem "$bundle/msi" -Filter "PolyUI_$($version)_x64*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$msi) { throw "Missing MSI installer" }
          New-Item -ItemType Directory -Force "release-artifacts/windows" | Out-Null
          Copy-Item $nsis.FullName "release-artifacts/windows/PolyUI-$version-windows-x64-setup.exe"
          Copy-Item $msi.FullName "release-artifacts/windows/PolyUI-$version-windows-x64.msi"

      - name: Build PolyUI Ollama Windows installer
        if: matrix.platform == 'windows'
        run: bun run ollama-setup

      - name: Validate Windows Ollama bundle
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $ollama = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "PolyUI-Ollama_$($version)_x64-setup.exe" | Select-Object -First 1
          if (!$ollama) { throw "Missing Ollama NSIS installer" }
          Copy-Item $ollama.FullName "release-artifacts/windows/PolyUI-$version-windows-x64-ollama-setup.exe"
          if (!(Test-Path "release-artifacts/windows/PolyUI-$version-windows-x64-setup.exe")) {
            throw "Normal installer missing after Ollama bundle; output was overwritten"
          }

      # --- macOS / Linux ------------------------------------------------
      - name: Validate macOS bundle
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          test -d src-tauri/target/release/bundle/macos/PolyUI.app
          test -f src-tauri/target/release/bundle/macos/PolyUI.app/Contents/Resources/libonnxruntime.dylib
          DMG="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -type f | head -n 1)"
          test -n "$DMG"
          mkdir -p release-artifacts/macos
          cp "$DMG" "release-artifacts/macos/PolyUI-$VERSION-macos-universal.dmg"

      - name: Validate Linux bundles
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          BUNDLE="src-tauri/target/release/bundle"
          OUT="release-artifacts/linux-${{ matrix.arch }}"
          test -x src-tauri/target/release/polyui
          DEB="$(find "$BUNDLE/deb" -maxdepth 1 -name '*.deb' -type f | head -n 1)"
          RPM="$(find "$BUNDLE/rpm" -maxdepth 1 -name '*.rpm' -type f | head -n 1)"
          APPIMAGE="$(find "$BUNDLE/appimage" -maxdepth 1 -name '*.AppImage' -type f | head -n 1)"
          test -n "$DEB" && test -n "$RPM" && test -n "$APPIMAGE"
          # CEF runtime must ship inside the packages: libcef.so is a hard
          # dynamic dependency of the binary, so a package without it does
          # not even launch.
          CONTENTS="$(dpkg-deb -c "$DEB")"
          for f in libonnxruntime.so PolyUI/libcef.so PolyUI/icudtl.dat PolyUI/resources.pak PolyUI/locales/en-US.pak; do
            grep -q "$f" <<<"$CONTENTS" || { echo "deb is missing $f"; exit 1; }
          done
          mkdir -p "$OUT"
          cp "$DEB" "$OUT/PolyUI-$VERSION-linux-${{ matrix.arch }}.deb"
          cp "$RPM" "$OUT/PolyUI-$VERSION-linux-${{ matrix.arch }}.rpm"
          cp "$APPIMAGE" "$OUT/PolyUI-$VERSION-linux-${{ matrix.arch }}.AppImage"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: polyui-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: release-artifacts/*/*
